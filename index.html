<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mood Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="ambient-breathe" class="breathing-circle"></div>

    <div class="container" id="main-container">
        <div id="initial-view">
            <button class="main-btn" id="trigger-btn">Mood</button>
        </div>

        <div id="selector-view" class="hidden">
            <h1>How are we feeling?</h1>
            <p>Select your current state so we can adjust the room.</p>
            <div id="mood-selector">
                <button class="mood-option" data-mood="depressed">Depressed</button>
                <button class="mood-option" data-mood="anxious">Anxious</button>
                <button class="mood-option" data-mood="stressed">Stressed</button>
                <button class="mood-option" data-mood="happy">Happy</button>
                <button class="mood-option" data-mood="overstimulated">Overstimulated</button>
                <button class="mood-option" data-mood="burned-out">Burned Out</button>
                <button class="mood-option" data-mood="delulu">Delulu</button>
                <button class="mood-option" data-mood="apathetic">Apathetic</button>
            </div>
        </div>

        <div id="result-view" class="hidden">
            <h1 id="result-title">Title</h1>
            <p id="result-text">Description goes here.</p>
            <div id="context-actions">
                <button id="action-btn">Action</button>
            </div>
        </div>
    </div>

    <button id="reset-btn" class="reset-btn hidden">Mood</button>

    <script src="scripts/app.js"></script>
</body>
</html>
